[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "binance-doctalk"
version = "0.1.0"
description = "An independent, evidence-grounded crypto education assistant and evaluation harness"
requires-python = ">=3.11"
dependencies = []
license = {file = "LICENSE"}

[project.scripts]
doctalk = "binance_doctalk.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
binance_doctalk = ["ui.html"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
