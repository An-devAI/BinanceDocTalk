name: Python checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  core:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -v
      - run: python scripts/doctalk.py audit-benchmark
      - run: python scripts/doctalk.py demo --question "Why can a stop-limit order remain unfilled?"
      - run: python -m compileall -q src app.py web_app.py
  optional-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-ui.lock.txt
      - run: python -m pip install -r requirements-ui.lock.txt
      - run: python scripts/check_optional_ui.py
      - name: Check optional Parquet reader on original fixtures
        run: python scripts/check_huggingface_import.py
  format-grammar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install lm-format-enforcer==0.11.3
      - run: python scripts/check_format_grammar.py
